<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b14" />
    <title>Stack Saver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <div id="app" class="app">
      <main id="screen" class="screen"></main>

      <nav class="tabbar" aria-label="Main">
        <a class="tab active" href="#/home" aria-label="Home" data-icon="home"></a>
        <button class="tab" type="button" data-action="buy-any" aria-label="Buy a stack" data-icon="logo"></button>
        <a class="tab" href="#/new" aria-label="New goal" data-icon="plus"></a>
      </nav>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <div id="modal" class="modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <div class="modal-grip"></div>
          <h2 id="modal-title"></h2>
          <p id="modal-body"></p>
          <button type="button" class="btn-dark" id="modal-ok"></button>
          <button type="button" class="btn-text dark" id="modal-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <script src="savings.js"></script>
    <script src="app.js"></script>
  </body>
</html>
